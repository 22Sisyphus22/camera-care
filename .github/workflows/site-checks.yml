name: Site checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links, assets, sitemap and images
        env:
          SITE_DIR: .
          MAX_IMG_KB: 800
        shell: python
        run: |
          import os, re, sys, html.parser, urllib.parse, xml.etree.ElementTree as ET
          root = os.path.abspath(os.environ["SITE_DIR"]); max_kb = int(float(os.environ["MAX_IMG_KB"]))
          errors, warns = [], []
          class P(html.parser.HTMLParser):
              def __init__(s): super().__init__(); s.refs=[]; s.title=False; s.lang=False
              def handle_starttag(s, tag, attrs):
                  a = dict(attrs)
                  if tag == "html" and a.get("lang"): s.lang = True
                  if tag == "title": s.title = True
                  for k in ("href", "src"):
                      if a.get(k): s.refs.append(a[k])
                  if a.get("srcset"):
                      s.refs += [p.strip().split(" ")[0] for p in a["srcset"].split(",") if p.strip()]
          def resolve(page, ref):
              u = urllib.parse.urlparse(ref)
              if u.scheme or ref.startswith(("#", "//", "mailto:", "tel:", "data:", "javascript:")) or "{" in ref: return None
              path = urllib.parse.unquote(u.path)
              if not path: return None
              base = root if path.startswith("/") else os.path.dirname(page)
              t = os.path.normpath(os.path.join(base, path.lstrip("/")))
              cands = [t, t + ".html", os.path.join(t, "index.html")]
              return t, any(os.path.isfile(c) for c in cands)
          pages = []
          for d, dirs, files in os.walk(root):
              dirs[:] = [x for x in dirs if not x.startswith(".") and x != "node_modules"]
              for f in files:
                  p = os.path.join(d, f); rel = os.path.relpath(p, root)
                  if f.endswith(".html"): pages.append(p)
                  if f.lower().endswith((".jpg", ".jpeg", ".png", ".webp", ".gif")):
                      kb = os.path.getsize(p) // 1024
                      if kb > max_kb * 3: errors.append(f"{rel}: image is {kb} KB (limit {max_kb*3} KB) - compress it")
                      elif kb > max_kb: warns.append(f"{rel}: image is {kb} KB (aim for under {max_kb} KB)")
          for p in pages:
              rel = os.path.relpath(p, root); parser = P()
              parser.feed(open(p, encoding="utf-8", errors="replace").read())
              if not parser.title: warns.append(f"{rel}: no <title>")
              if not parser.lang: warns.append(f"{rel}: <html> has no lang attribute")
              for ref in parser.refs:
                  r = resolve(p, ref)
                  if r and not r[1]: errors.append(f"{rel}: broken link/asset -> {ref}")
          sm = os.path.join(root, "sitemap.xml")
          if os.path.isfile(sm):
              for loc in ET.parse(sm).getroot().iter("{http://www.sitemaps.org/schemas/sitemap/0.9}loc"):
                  path = urllib.parse.urlparse(loc.text.strip()).path or "/"
                  r = resolve(os.path.join(root, "index.html"), path if path != "/" else "/index.html")
                  if r and not r[1]: errors.append(f"sitemap.xml: {loc.text.strip()} has no matching file")
          summ = open(os.environ["GITHUB_STEP_SUMMARY"], "a")
          summ.write(f"### Site checks\n{len(pages)} pages, {len(errors)} errors, {len(warns)} warnings\n\n")
          for w in warns: print(f"::warning::{w}"); summ.write(f"- ⚠️ {w}\n")
          for e in errors: print(f"::error::{e}"); summ.write(f"- ❌ {e}\n")
          sys.exit(1 if errors else 0)
